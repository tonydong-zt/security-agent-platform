services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security_agent
      POSTGRES_USER: security_agent
      POSTGRES_PASSWORD: change_me_before_use
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://security_agent:change_me_before_use@postgres:5432/security_agent
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
